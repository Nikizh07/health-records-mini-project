services:
  db:
    image: postgres:16
    container_name: migrant-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: migrant_clinic_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env to match DATABASE_URL}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migrant_clinic_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
    name: migrant_clinic_pgdata
