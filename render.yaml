# ============================================================
# Render Blueprint — temporary hosted backend for phone testing
# ============================================================
# Gives the Flutter app a public HTTPS URL, so an APK can be tested on a
# phone with no PC, cable or tunnel. Free tier, so read the caveats:
#
#   * The web service sleeps after ~15 min idle; the next request cold-starts
#     it and can take up to a minute. The app's Dio timeout is 10 s, so the
#     first call after a nap usually has to be retried once.
#   * The free database expires 30 days after it is created.
#   * There is no persistent disk, so uploaded reports (uploads/reports/,
#     served from /uploads) are wiped on every deploy and restart. Records
#     and prescriptions live in Postgres and survive; the files do not.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file, creates both services and asks for the two values marked
# `sync: false`. Nothing here is a secret; the key is pasted in the dashboard.
#
# After the first deploy the database is empty. Seed it from your PC with the
# database's *External* connection string (Render dashboard → the database →
# Connections):
#   cd backend
#   DATABASE_URL='<external-url>' node scripts/seed-nearby-clinics.js
#   DATABASE_URL='<external-url>' node scripts/seed-drug-interactions.js
# ============================================================

services:
  - type: web
    name: migrant-clinic-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Applies any pending migrations before serving. `migrate deploy` is
    # idempotent, so it is safe on every boot.
    dockerCommand: npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        # Production also refuses anonymous (guest) Firebase tokens — see
        # middleware/authenticate.js. Sign in with a phone or email account.
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: migrant-clinic-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        # Paste the whole backend/config/firebase-adminsdk.json, or its base64.
        # The key file is .dockerignored, so without this every authenticated
        # request fails — config/firebase.js says so in the logs.
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: AI_ENABLED
        # The drug-interaction check falls back to the curated 56-pair table,
        # so no LLM key is needed to test. Set a provider later if you want it.
        value: "false"

databases:
  - name: migrant-clinic-db
    plan: free
    databaseName: migrant_clinic_db
    user: migrant_clinic
    region: singapore
